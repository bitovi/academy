<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="The phases of a request and the error code each one produces. Parsing fails with GRAPHQL_PARSE_FAILED, validation with GRAPHQL_VALIDATION_FAILED, and checking variables with BAD_USER_INPUT; these happen before any resolver runs, so the response has no data. While resolvers run, a thrown GraphQLError can carry BAD_USER_INPUT and an ordinary Error becomes INTERNAL_SERVER_ERROR; these errors have a path, and the rest of the data can still come back." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <rect x="20" y="60" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="105" y="85" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">Parse</text>
  <text x="105" y="103" text-anchor="middle" fill="#6b7280" font-size="13">is it GraphQL?</text>
  <line x1="190" y1="88" x2="214" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="216" y="60" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="301" y="85" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">Validate</text>
  <text x="301" y="103" text-anchor="middle" fill="#6b7280" font-size="13">does it fit the schema?</text>
  <line x1="386" y1="88" x2="410" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="412" y="60" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="497" y="85" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">Check variables</text>
  <text x="497" y="103" text-anchor="middle" fill="#6b7280" font-size="13">do values fit types?</text>
  <line x1="582" y1="88" x2="606" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="608" y="60" width="170" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="693" y="85" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="600">Run resolvers</text>
  <text x="693" y="103" text-anchor="middle" fill="#0f766e" font-size="13">build the data</text>
  <line x1="20" y1="36" x2="582" y2="36" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="20" y1="36" x2="20" y2="44" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="582" y1="36" x2="582" y2="44" stroke="#6b7280" stroke-width="1.5"/>
  <text x="301" y="28" text-anchor="middle" fill="#6b7280" font-size="13">before any resolver runs</text>
  <line x1="105" y1="116" x2="105" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="105" y="166" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="600" font-family="Menlo, Consolas, monospace">GRAPHQL_PARSE_FAILED</text>
  <text x="105" y="186" text-anchor="middle" fill="#6b7280" font-size="12">a missing }</text>
  <line x1="301" y1="116" x2="301" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="301" y="166" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="600" font-family="Menlo, Consolas, monospace">GRAPHQL_VALIDATION_FAILED</text>
  <text x="301" y="186" text-anchor="middle" fill="#6b7280" font-size="12">a field that doesn't exist</text>
  <line x1="497" y1="116" x2="497" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="497" y="166" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="600" font-family="Menlo, Consolas, monospace">BAD_USER_INPUT</text>
  <text x="497" y="186" text-anchor="middle" fill="#6b7280" font-size="12">a variable like 2026-02-30</text>
  <line x1="693" y1="116" x2="693" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="693" y="166" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="600" font-family="Menlo, Consolas, monospace">BAD_USER_INPUT</text>
  <text x="693" y="184" text-anchor="middle" fill="#6b7280" font-size="12">you throw it</text>
  <text x="693" y="208" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="600" font-family="Menlo, Consolas, monospace">INTERNAL_SERVER_ERROR</text>
  <text x="693" y="226" text-anchor="middle" fill="#6b7280" font-size="12">an ordinary Error</text>
  <rect x="20" y="252" width="562" height="56" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="301" y="276" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Response has errors and no data</text>
  <text x="301" y="296" text-anchor="middle" fill="#6b7280" font-size="13">nothing ran, so there's nothing to return</text>
  <rect x="608" y="252" width="170" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="693" y="276" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="600">Errors have a path</text>
  <text x="693" y="296" text-anchor="middle" fill="#0f766e" font-size="13">other data can survive</text>
</svg>
