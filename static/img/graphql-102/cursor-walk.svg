<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Paging through claims two at a time. Request 1 asks for first: 2 and gets CLM-5001 and CLM-5002, with endCursor YzI= and hasNextPage true. Request 2 sends after: YzI= and gets CLM-5003 and CLM-5004, with endCursor YzQ=. Request 3 sends after: YzQ= and gets CLM-5005 and CLM-5006, with endCursor YzY= and hasNextPage false." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <rect x="20" y="20" width="240" height="62" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="140" y="44" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Request 1</text>
  <text x="140" y="66" text-anchor="middle" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">first: 2</text>
  <line x1="260" y1="51" x2="296" y2="51" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="20" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="358" y="48" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5001</text>
  <text x="358" y="66" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzE=</text>
  <rect x="424" y="20" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="482" y="48" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5002</text>
  <text x="482" y="66" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzI=</text>
  <line x1="540" y1="51" x2="566" y2="51" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="20" width="210" height="62" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="675" y="46" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">endCursor: YzI=</text>
  <text x="675" y="66" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">hasNextPage: true</text>
  <path d="M 675 82 C 675 104, 160 100, 160 122" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
  <rect x="308.48" y="92" width="223.04" height="18" fill="#ffffff"/>
  <text x="420" y="104" text-anchor="middle" fill="#0f766e" font-size="12">becomes the next request's after</text>
  <rect x="20" y="124" width="240" height="62" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="140" y="148" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Request 2</text>
  <text x="140" y="170" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">first: 2, after: "YzI="</text>
  <line x1="260" y1="155" x2="296" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="124" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="358" y="152" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5003</text>
  <text x="358" y="170" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzM=</text>
  <rect x="424" y="124" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="482" y="152" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5004</text>
  <text x="482" y="170" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzQ=</text>
  <line x1="540" y1="155" x2="566" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="124" width="210" height="62" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="675" y="150" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">endCursor: YzQ=</text>
  <text x="675" y="170" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">hasNextPage: true</text>
  <path d="M 675 186 C 675 208, 160 204, 160 226" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
  <rect x="308.48" y="196" width="223.04" height="18" fill="#ffffff"/>
  <text x="420" y="208" text-anchor="middle" fill="#0f766e" font-size="12">becomes the next request's after</text>
  <rect x="20" y="228" width="240" height="62" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="140" y="252" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Request 3</text>
  <text x="140" y="274" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">first: 2, after: "YzQ="</text>
  <line x1="260" y1="259" x2="296" y2="259" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="228" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="358" y="256" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5005</text>
  <text x="358" y="274" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzU=</text>
  <rect x="424" y="228" width="116" height="62" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="482" y="256" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">CLM-5006</text>
  <text x="482" y="274" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">cursor YzY=</text>
  <line x1="540" y1="259" x2="566" y2="259" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="228" width="210" height="62" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="675" y="254" text-anchor="middle" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">endCursor: YzY=</text>
  <text x="675" y="274" text-anchor="middle" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">hasNextPage: false</text>
</svg>
