<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="The same query with a bad cursor, against two schemas. When claimsConnection is required (ClaimConnection!), its null moves up to data, so the LIFE policy result is lost and data is null. When claimsConnection is nullable, only claimsConnection becomes null and policies still returns LIFE-100004." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="200" y="26" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">claimsConnection: ClaimConnection!</text>
  <rect x="140.0" y="44" width="120" height="40" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="69" text-anchor="middle" fill="#b45309" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">data</text>
  <line x1="170" y1="84" x2="110" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="84" x2="290" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="130" width="160" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="110" y="152" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">policies</text>
  <text x="110" y="170" text-anchor="middle" fill="#6b7280" font-size="13">LIFE-100004</text>
  <rect x="210" y="130" width="160" height="50" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="290" y="152" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">claimsConnection</text>
  <text x="290" y="170" text-anchor="middle" fill="#b45309" font-size="13">bad cursor: error</text>
  <path d="M 360 130 C 360 100, 270.0 90, 262.0 70" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <text x="368" y="102" text-anchor="start" fill="#b45309" font-size="13">null moves up</text>
  <text x="110" y="200" text-anchor="middle" fill="#6b7280" font-size="13">result lost</text>
  <rect x="30" y="230" width="340" height="70" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="46" y="254" text-anchor="start" fill="#6b7280" font-size="12">Response</text>
  <text x="46" y="280" text-anchor="start" fill="#b45309" font-size="13" font-family="Menlo, Consolas, monospace">"data": null</text>
  <text x="600" y="26" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">claimsConnection: ClaimConnection</text>
  <rect x="540.0" y="44" width="120" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="600" y="69" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">data</text>
  <line x1="570" y1="84" x2="510" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="84" x2="690" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="130" width="160" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="510" y="152" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">policies</text>
  <text x="510" y="170" text-anchor="middle" fill="#6b7280" font-size="13">LIFE-100004</text>
  <rect x="610" y="130" width="160" height="50" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="690" y="152" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">claimsConnection</text>
  <text x="690" y="170" text-anchor="middle" fill="#b45309" font-size="13">bad cursor: error</text>
  <text x="690" y="200" text-anchor="middle" fill="#b45309" font-size="13">becomes null</text>
  <rect x="430" y="230" width="340" height="130" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="446" y="254" text-anchor="start" fill="#6b7280" font-size="12">Response</text>
  <text x="446" y="276" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">"data": {</text>
  <text x="460.6" y="291" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">"policies": [</text>
  <text x="475.2" y="306" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">{ "policyNumber": "LIFE-100004" }</text>
  <text x="460.6" y="321" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">],</text>
  <text x="460.6" y="336" text-anchor="start" fill="#b45309" font-size="12" font-family="Menlo, Consolas, monospace">"claimsConnection": null</text>
  <text x="446" y="351" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <line x1="400" y1="20" x2="400" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
</svg>
