<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-label="Where caching happens, from the client to the data. A hit in Apollo Client's InMemoryCache skips the network. A hit in a CDN or browser cache, which needs GET requests, skips the server. A hit in the server's response cache skips the resolvers. DataLoader skips loading the same record twice within one request." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="250" fill="#ffffff"/>
  <rect x="14" y="70" width="112" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="70" y="95" text-anchor="middle" fill="#0f766e" font-size="13.5" font-weight="600">Apollo Client</text>
  <text x="70" y="113" text-anchor="middle" fill="#0f766e" font-size="12">InMemoryCache</text>
  <line x1="126" y1="98" x2="144" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="152" text-anchor="middle" fill="#0f766e" font-size="12">a hit</text>
  <text x="70" y="168" text-anchor="middle" fill="#0f766e" font-size="12">skips the network</text>
  <rect x="146" y="70" width="112" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="202" y="95" text-anchor="middle" fill="#0f766e" font-size="13.5" font-weight="600">CDN / browser</text>
  <text x="202" y="113" text-anchor="middle" fill="#0f766e" font-size="12">GET requests only</text>
  <line x1="258" y1="98" x2="276" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="152" text-anchor="middle" fill="#0f766e" font-size="12">a hit</text>
  <text x="202" y="168" text-anchor="middle" fill="#0f766e" font-size="12">skips the server</text>
  <rect x="278" y="70" width="112" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="334" y="95" text-anchor="middle" fill="#0f766e" font-size="13.5" font-weight="600">Response cache</text>
  <text x="334" y="113" text-anchor="middle" fill="#0f766e" font-size="12">on the server</text>
  <line x1="390" y1="98" x2="408" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="334" y="152" text-anchor="middle" fill="#0f766e" font-size="12">a hit</text>
  <text x="334" y="168" text-anchor="middle" fill="#0f766e" font-size="12">skips the resolvers</text>
  <rect x="410" y="70" width="112" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="466" y="103" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="600">Resolvers</text>
  <line x1="522" y1="98" x2="540" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="542" y="70" width="112" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="598" y="95" text-anchor="middle" fill="#0f766e" font-size="13.5" font-weight="600">DataLoader</text>
  <text x="598" y="113" text-anchor="middle" fill="#0f766e" font-size="12">one request</text>
  <line x1="654" y1="98" x2="672" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="598" y="152" text-anchor="middle" fill="#0f766e" font-size="12">a hit</text>
  <text x="598" y="168" text-anchor="middle" fill="#0f766e" font-size="12">skips repeat loads</text>
  <rect x="674" y="70" width="112" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="730" y="103" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="600">Data</text>
  <text x="14" y="40" text-anchor="start" fill="#6b7280" font-size="13">request travels this way →</text>
  <text x="400" y="220" text-anchor="middle" fill="#6b7280" font-size="13">Each hit answers the request right there, so nothing to its right runs.</text>
</svg>
