<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="What happens to issuePolicy for each Authorization header. With no header or an unknown token, getUser returns null and issuePolicy throws UNAUTHENTICATED with HTTP status 401. With Bearer adjuster-token, the user is Sam Rivera, an ADJUSTER, and issuePolicy throws FORBIDDEN. With Bearer agent-token, the user is Alex Chen, an AGENT, and the policy is issued." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="135" y="30" text-anchor="middle" fill="#6b7280" font-size="13">Authorization header</text>
  <text x="405" y="30" text-anchor="middle" fill="#6b7280" font-size="13">context: getUser → user</text>
  <text x="680" y="30" text-anchor="middle" fill="#6b7280" font-size="13">issuePolicy</text>
  <rect x="20" y="50" width="230" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="135" y="83" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">(no header)</text>
  <line x1="250" y1="78" x2="298" y2="78" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="50" width="210" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="405" y="83" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="600" font-family="Menlo, Consolas, monospace">null</text>
  <line x1="510" y1="78" x2="578" y2="78" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="50" width="200" height="56" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="680" y="75" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">UNAUTHENTICATED</text>
  <text x="680" y="93" text-anchor="middle" fill="#b45309" font-size="12">HTTP 401</text>
  <rect x="20" y="136" width="230" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="135" y="169" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">Bearer adjuster-token</text>
  <line x1="250" y1="164" x2="298" y2="164" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="136" width="210" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="405" y="169" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="600">Sam Rivera, ADJUSTER</text>
  <line x1="510" y1="164" x2="578" y2="164" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="136" width="200" height="56" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="680" y="161" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">FORBIDDEN</text>
  <text x="680" y="179" text-anchor="middle" fill="#b45309" font-size="12">logged in, not allowed</text>
  <rect x="20" y="222" width="230" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="135" y="255" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">Bearer agent-token</text>
  <line x1="250" y1="250" x2="298" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="222" width="210" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="405" y="255" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="600">Alex Chen, AGENT</text>
  <line x1="510" y1="250" x2="578" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="222" width="200" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="680" y="247" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="600">Policy issued</text>
  <text x="680" y="265" text-anchor="middle" fill="#0f766e" font-size="12">HOME-100006</text>
</svg>
