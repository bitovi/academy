<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Which Policy fields read which properties of p1. Fields with matching names use the default resolver. policyholder has its own resolver that reads policyholderId. policyholderId is in the data but not the schema, so clients can't ask for it. annualPremium has no property and no resolver, so it returns null, which is an error for a non-null field." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="155" y="28" text-anchor="middle" fill="#6b7280" font-size="13">type Policy (schema)</text>
  <text x="645" y="28" text-anchor="middle" fill="#6b7280" font-size="13">p1 in data.ts</text>
  <rect x="40" y="44" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="66" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">id</text>
  <rect x="40" y="88" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="110" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">policyNumber</text>
  <rect x="40" y="132" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="154" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">type</text>
  <rect x="40" y="176" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="198" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">monthlyPremium</text>
  <rect x="40" y="220" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="242" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">effectiveDate</text>
  <rect x="40" y="264" width="230" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="155" y="286" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">riskTier</text>
  <rect x="40" y="308" width="230" height="34" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="155" y="330" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">policyholder</text>
  <rect x="40" y="352" width="230" height="34" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="155" y="374" text-anchor="middle" fill="#b45309" font-size="14" font-weight="600" font-family="Menlo, Consolas, monospace">annualPremium!</text>
  <rect x="520" y="44" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="66" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">id: "p1"</text>
  <rect x="520" y="88" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="110" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">policyNumber: "AUTO-100001"</text>
  <rect x="520" y="132" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="154" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">type: "AUTO"</text>
  <rect x="520" y="176" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="198" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">monthlyPremium: 142.5</text>
  <rect x="520" y="220" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="242" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">effectiveDate: "2025-01-15"</text>
  <rect x="520" y="264" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="286" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">riskTier: "MEDIUM"</text>
  <rect x="520" y="308" width="250" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="645" y="330" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">policyholderId: "ph1"</text>
  <line x1="270" y1="61" x2="518" y2="61" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="270" y1="105" x2="518" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="270" y1="149" x2="518" y2="149" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="270" y1="193" x2="518" y2="193" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="270" y1="237" x2="518" y2="237" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="270" y1="281" x2="518" y2="281" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <text x="395" y="28" text-anchor="middle" fill="#6b7280" font-size="13">default resolver: same name</text>
  <rect x="310" y="305" width="160" height="40" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="390" y="322" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="600">your resolver</text>
  <text x="390" y="340" text-anchor="middle" fill="#0f766e" font-size="13">finds ph1</text>
  <line x1="270" y1="325" x2="310" y2="325" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="470" y1="325" x2="518" y2="325" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="645" y="360" text-anchor="middle" fill="#6b7280" font-size="13">not in the schema, so clients</text>
  <text x="645" y="376" text-anchor="middle" fill="#6b7280" font-size="13">can't ask for policyholderId</text>
  <text x="286" y="374" text-anchor="start" fill="#b45309" font-size="13">no property, no resolver → null → error</text>
  <text x="155" y="418" text-anchor="middle" fill="#6b7280" font-size="12">annualPremium is the field you add next</text>
</svg>
