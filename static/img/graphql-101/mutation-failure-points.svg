<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Three places an issuePolicy request can fail. Validation errors stop the request before anything runs, so nothing is saved. An error thrown by the resolver, like Policyholder ph99 not found, also saves nothing. An error while building the response, like a null riskTier on a non-null field, comes after the resolver already saved the policy to data.json." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="360" fill="#ffffff"/>
  <rect x="30" y="30" width="190" height="76" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="125" y="56" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">1. Validate</text>
  <text x="125" y="78" text-anchor="middle" fill="#6b7280" font-size="13">check the request</text>
  <text x="125" y="95" text-anchor="middle" fill="#6b7280" font-size="13">against the schema</text>
  <line x1="220" y1="68" x2="273" y2="68" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="275" y="30" width="190" height="76" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="370" y="56" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">2. Run resolver</text>
  <text x="370" y="78" text-anchor="middle" fill="#6b7280" font-size="13">issuePolicy saves</text>
  <text x="370" y="95" text-anchor="middle" fill="#6b7280" font-size="13">the policy</text>
  <line x1="465" y1="68" x2="518" y2="68" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="30" width="190" height="76" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="615" y="56" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">3. Build response</text>
  <text x="615" y="78" text-anchor="middle" fill="#6b7280" font-size="13">check every field,</text>
  <text x="615" y="95" text-anchor="middle" fill="#6b7280" font-size="13">including non-null</text>
  <line x1="710" y1="68" x2="790" y2="68" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="56" text-anchor="middle" fill="#6b7280" font-size="13">response</text>
  <rect x="370" y="128" width="160" height="34" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="600">saves to data.json</text>
  <line x1="435" y1="106" x2="435" y2="126" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="125" y1="106" x2="125" y2="188" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="125" y="184" text-anchor="middle" fill="#1f2937" font-size="1"></text>
  <rect x="30" y="190" width="190" height="70" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="125" y="212" text-anchor="middle" fill="#6b7280" font-size="12">fails here:</text>
  <text x="125" y="230" text-anchor="middle" fill="#374151" font-size="13">monthlyPremium</text>
  <text x="125" y="247" text-anchor="middle" fill="#374151" font-size="13">was not provided</text>
  <text x="125" y="290" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">No data. Nothing saved.</text>
  <line x1="320" y1="106" x2="320" y2="188" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="370" y="184" text-anchor="middle" fill="#1f2937" font-size="1"></text>
  <rect x="275" y="190" width="190" height="70" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="370" y="212" text-anchor="middle" fill="#6b7280" font-size="12">fails here:</text>
  <text x="370" y="230" text-anchor="middle" fill="#374151" font-size="13">Policyholder ph99</text>
  <text x="370" y="247" text-anchor="middle" fill="#374151" font-size="13">not found</text>
  <text x="370" y="290" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">data: null. Nothing saved.</text>
  <line x1="615" y1="106" x2="615" y2="188" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-warn)"/>
  <text x="615" y="184" text-anchor="middle" fill="#1f2937" font-size="1"></text>
  <rect x="520" y="190" width="190" height="70" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="615" y="212" text-anchor="middle" fill="#6b7280" font-size="12">fails here:</text>
  <text x="615" y="230" text-anchor="middle" fill="#b45309" font-size="13">Cannot return null for</text>
  <text x="615" y="247" text-anchor="middle" fill="#b45309" font-size="13">Policy.riskTier</text>
  <text x="615" y="290" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600">data: null, but the policy</text>
  <text x="615" y="308" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600">is already saved</text>
  <text x="20" y="336" text-anchor="middle" fill="#1f2937" font-size="1"></text>
</svg>
