  <text x="169" y="126" text-anchor="middle" fill="#374151" font-size="13">ph1</text>
  <line x1="249" y1="86" x2="320" y2="158" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <rect x="247.74" y="113" width="73.52" height="19" fill="#ffffff"/>
