  <text x="98" y="78" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p1</text>
  <rect x="181" y="40" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="249" y="60" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
  <text x="249" y="78" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p2</text>
  <rect x="332" y="40" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="400" y="60" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
  <text x="400" y="78" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p3</text>
