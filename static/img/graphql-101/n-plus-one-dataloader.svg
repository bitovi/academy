  <text x="30" y="256" text-anchor="start" fill="#1f2937" font-size="15" font-weight="600">With DataLoader: 1 lookup</text>
  <rect x="30" y="270" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="98" y="290" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
