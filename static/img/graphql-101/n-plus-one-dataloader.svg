  <text x="551" y="60" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
  <text x="551" y="78" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p4</text>
  <rect x="634" y="40" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="702" y="60" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
  <text x="702" y="78" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p5</text>
