  <text x="551" y="308" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p4</text>
  <rect x="634" y="270" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="702" y="290" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">policyholder</text>
  <text x="702" y="308" text-anchor="middle" fill="#6b7280" font-size="13" font-family="Menlo, Consolas, monospace">parent = p5</text>
  <rect x="150" y="380" width="500" height="60" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="600">DataLoader</text>
  <text x="400" y="425" text-anchor="middle" fill="#0f766e" font-size="13">waits one event-loop turn, removes duplicates</text>
  <line x1="98" y1="316" x2="190" y2="378" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="99.08" y="338" width="89.84" height="18" fill="#ffffff"/>
  <text x="144" y="350" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">load("ph1")</text>
  <line x1="249" y1="316" x2="295" y2="378" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="227.08" y="338" width="89.84" height="18" fill="#ffffff"/>
  <text x="272" y="350" text-anchor="middle" fill="#0f766e" font-size="12" font-family="Menlo, Consolas, monospace">load("ph1")</text>
  <line x1="400" y1="316" x2="400" y2="378" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="355.08" y="338" width="89.84" height="18" fill="#ffffff"/>
