<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="How resolvers run for policies { policyholder { name } }. Query.policies runs once and returns five policies. Policy.policyholder then runs once per policy with that policy as parent, returning ph1, ph1, ph2, ph3, ph3. A default resolver reads each policyholder's name." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="20" y="46" text-anchor="start" fill="#6b7280" font-size="13">runs once</text>
  <rect x="334.0" y="22" width="260" height="44" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="464" y="41" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="600">Query.policies</text>
  <text x="464" y="59" text-anchor="middle" fill="#0f766e" font-size="13">your resolver</text>
  <text x="20" y="126" text-anchor="start" fill="#6b7280" font-size="13">returns 5</text>
  <text x="20" y="142" text-anchor="start" fill="#6b7280" font-size="13">policies</text>
  <text x="20" y="206" text-anchor="start" fill="#6b7280" font-size="13">runs once</text>
  <text x="20" y="222" text-anchor="start" fill="#6b7280" font-size="13">per policy</text>
  <text x="20" y="296" text-anchor="start" fill="#6b7280" font-size="13">returns</text>
  <text x="20" y="312" text-anchor="start" fill="#6b7280" font-size="13">policyholders</text>
