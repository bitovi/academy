<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="The same AdjusterAssigned event, with id 4a30..., is delivered twice. Without a check, the consumer handles both copies, and claim c6 ends up with Dana Kim assigned twice. With a check, the consumer records each event id it handles, in the same save as the claim; when the second copy arrives, its id is already recorded, so the consumer skips it, and c6 has one assignment." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" fill="#b45309" font-size="14" font-weight="600">Without a check: one event, two assignments</text>
  <rect x="20" y="44" width="168" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="63" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">AdjusterAssigned</text>
  <text x="104" y="81" text-anchor="middle" fill="#6b7280" font-size="11.5" font-family="Menlo, Consolas, monospace">id 4a30..., c6</text>
  <rect x="20" y="100" width="168" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="119" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">AdjusterAssigned</text>
  <text x="104" y="137" text-anchor="middle" fill="#6b7280" font-size="11.5" font-family="Menlo, Consolas, monospace">id 4a30..., c6 again</text>
  <rect x="230" y="66" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="315" y="91" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">handleAdjusterAssigned</text>
  <text x="315" y="109" text-anchor="middle" fill="#6b7280" font-size="11.5">adds an assignment</text>
  <line x1="188" y1="66" x2="228" y2="86" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="188" y1="122" x2="228" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="94" x2="456" y2="94" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <rect x="458" y="58" width="320" height="72" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="618" y="82" text-anchor="middle" fill="#b45309" font-size="12.5" font-weight="600">c6 assignments</text>
  <text x="618" y="102" text-anchor="middle" fill="#b45309" font-size="12.5" font-family="Menlo, Consolas, monospace">Dana Kim</text>
  <text x="618" y="120" text-anchor="middle" fill="#b45309" font-size="12.5" font-family="Menlo, Consolas, monospace">Dana Kim</text>
  <line x1="20" y1="170" x2="780" y2="170" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="20" y="200" text-anchor="start" fill="#0f766e" font-size="14" font-weight="600">With a check: the second copy is skipped</text>
  <rect x="20" y="218" width="168" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="237" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">AdjusterAssigned</text>
  <text x="104" y="255" text-anchor="middle" fill="#6b7280" font-size="11.5" font-family="Menlo, Consolas, monospace">id 4a30..., c6</text>
  <rect x="20" y="290" width="168" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="309" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">AdjusterAssigned</text>
  <text x="104" y="327" text-anchor="middle" fill="#6b7280" font-size="11.5" font-family="Menlo, Consolas, monospace">id 4a30..., c6 again</text>
  <rect x="230" y="218" width="170" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="315" y="237" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="600">id handled before?</text>
  <text x="315" y="255" text-anchor="middle" fill="#6b7280" font-size="11.5">no: handle it</text>
  <rect x="230" y="290" width="170" height="44" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="315" y="309" text-anchor="middle" fill="#b45309" font-size="12.5" font-weight="600">id handled before?</text>
  <text x="315" y="327" text-anchor="middle" fill="#b45309" font-size="11.5">yes: skip it</text>
  <line x1="188" y1="240" x2="228" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="188" y1="312" x2="228" y2="312" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="240" x2="456" y2="240" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="458" y="206" width="320" height="92" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="618" y="228" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="600">one save to claims.json</text>
  <text x="618" y="250" text-anchor="middle" fill="#1f2937" font-size="12.5" font-family="Menlo, Consolas, monospace">c6 assignments: Dana Kim</text>
  <text x="618" y="272" text-anchor="middle" fill="#1f2937" font-size="12.5" font-family="Menlo, Consolas, monospace">processedEventIds: 4a30...</text>
  <text x="618" y="330" text-anchor="middle" fill="#6b7280" font-size="12">the id is saved with the change, so a restart</text>
  <text x="618" y="346" text-anchor="middle" fill="#6b7280" font-size="12">can't handle the event a second time</text>
</svg>
