<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="One claim's journey and the page that builds each step. A claim is filed through the gateway with status OPEN, a ClaimFiled event is published, an AdjusterAssigned event moves it to IN_REVIEW, approving it publishes ClaimApproved so Billing records a payout, and a subscription pushes the new status to the Claims Desk." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="20" y="22" fill="#6b7280" font-size="13">Claim status</text>
  <rect x="20" y="32" width="298" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="169" y="50" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace" font-size="13">OPEN</text>
  <rect x="328" y="32" width="144" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="400" y="50" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace" font-size="13">IN_REVIEW</text>
  <rect x="482" y="32" width="298" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="631" y="50" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace" font-size="13">APPROVED</text>
  <rect x="20" y="80" width="144" height="96" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <circle cx="40" cy="100" r="11" fill="#0f766e"/>
  <text x="40" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">1</text>
  <text x="92" y="132" text-anchor="middle" font-weight="600" fill="#1f2937">Claim filed</text>
  <text x="92" y="152" text-anchor="middle" fill="#6b7280" font-size="13">fileClaim through</text>
  <text x="92" y="168" text-anchor="middle" fill="#6b7280" font-size="13">the gateway</text>
  <text x="92" y="226" text-anchor="middle" fill="#0f766e" font-size="13">Federation Basics</text>
  <text x="92" y="243" text-anchor="middle" fill="#0f766e" font-size="13">and Entities</text>
  <line x1="164" y1="128" x2="173" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="174" y="80" width="144" height="96" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <circle cx="194" cy="100" r="11" fill="#0f766e"/>
  <text x="194" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">2</text>
  <text x="246" y="132" text-anchor="middle" font-weight="600" fill="#1f2937">Event published</text>
  <text x="246" y="152" text-anchor="middle" fill="#6b7280" font-size="13">ClaimFiled lands</text>
  <text x="246" y="168" text-anchor="middle" fill="#6b7280" font-size="13">in claim-events</text>
  <text x="246" y="226" text-anchor="middle" fill="#0f766e" font-size="13">Publishing Events</text>
  <line x1="318" y1="128" x2="327" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="328" y="80" width="144" height="96" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <circle cx="348" cy="100" r="11" fill="#0f766e"/>
  <text x="348" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">3</text>
  <text x="400" y="132" text-anchor="middle" font-weight="600" fill="#1f2937">Adjuster assigned</text>
  <text x="400" y="152" text-anchor="middle" fill="#6b7280" font-size="13">your API reads</text>
  <text x="400" y="168" text-anchor="middle" fill="#6b7280" font-size="13">AdjusterAssigned</text>
  <text x="400" y="226" text-anchor="middle" fill="#0f766e" font-size="13">Consuming Events</text>
  <line x1="472" y1="128" x2="481" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="482" y="80" width="144" height="96" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <circle cx="502" cy="100" r="11" fill="#0f766e"/>
  <text x="502" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">4</text>
  <text x="554" y="132" text-anchor="middle" font-weight="600" fill="#1f2937">Claim approved</text>
  <text x="554" y="152" text-anchor="middle" fill="#6b7280" font-size="13">Billing pays on</text>
  <text x="554" y="168" text-anchor="middle" fill="#6b7280" font-size="13">ClaimApproved</text>
  <text x="554" y="226" text-anchor="middle" fill="#0f766e" font-size="13">Publishing Events</text>
  <line x1="626" y1="128" x2="635" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="636" y="80" width="144" height="96" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <circle cx="656" cy="100" r="11" fill="#0f766e"/>
  <text x="656" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">5</text>
  <text x="708" y="132" text-anchor="middle" font-weight="600" fill="#1f2937">Desk updates live</text>
  <text x="708" y="152" text-anchor="middle" fill="#6b7280" font-size="13">a subscription</text>
  <text x="708" y="168" text-anchor="middle" fill="#6b7280" font-size="13">pushes the status</text>
  <text x="708" y="226" text-anchor="middle" fill="#0f766e" font-size="13">Live Updates</text>
  <text x="20" y="206" fill="#6b7280" font-size="13">Built on</text>
</svg>
