<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Dual write versus outbox. With a dual write, approveClaim saves the claim, then sends the event to Kafka; if Kafka is down or the server crashes in between, the claim is approved but Billing never hears about it. With an outbox, approveClaim saves the approved claim and a ClaimApproved event in one write to claims.json. The outbox relay checks the outbox every second, publishes each event to claim-events, and removes it once Kafka has it. If Kafka is down, the event waits in the outbox. Billing reads claim-events and records the payout." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" fill="#b45309" font-size="14" font-weight="600">Dual write: can lose events</text>
  <rect x="20" y="42" width="150" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="95" y="64" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">approveClaim</text>
  <text x="95" y="82" text-anchor="middle" fill="#6b7280" font-size="12">resolver</text>
  <line x1="170" y1="67" x2="206" y2="67" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="208" y="42" width="170" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="293" y="64" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">1. save the claim</text>
  <text x="293" y="82" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">APPROVED</text>
  <line x1="378" y1="67" x2="414" y2="67" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="416" y="42" width="170" height="50" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <text x="501" y="64" text-anchor="middle" fill="#b45309" font-size="13" font-weight="600">2. send the event</text>
  <text x="501" y="82" text-anchor="middle" fill="#b45309" font-size="12">Kafka down, or a crash</text>
  <text x="606" y="62" text-anchor="start" fill="#b45309" font-size="13" font-weight="600">claim approved,</text>
  <text x="606" y="80" text-anchor="start" fill="#b45309" font-size="13" font-weight="600">Billing never pays</text>
  <line x1="20" y1="118" x2="780" y2="118" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="20" y="148" text-anchor="start" fill="#0f766e" font-size="14" font-weight="600">Outbox: the event is saved with the claim</text>
  <rect x="20" y="182" width="150" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="95" y="209" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">approveClaim</text>
  <text x="95" y="227" text-anchor="middle" fill="#6b7280" font-size="12">resolver</text>
  <line x1="170" y1="212" x2="206" y2="212" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="208" y="164" width="220" height="104" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="318" y="184" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="600">one write to claims.json</text>
  <rect x="222" y="194" width="192" height="28" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="318" y="213" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600" font-family="Menlo, Consolas, monospace">claims: c4 APPROVED</text>
  <rect x="222" y="230" width="192" height="28" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="318" y="249" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="600" font-family="Menlo, Consolas, monospace">outbox: ClaimApproved</text>
  <line x1="428" y1="244" x2="464" y2="244" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="216" width="140" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="536" y="241" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">outbox relay</text>
  <text x="536" y="259" text-anchor="middle" fill="#6b7280" font-size="12">every second</text>
  <line x1="606" y1="244" x2="642" y2="244" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="644" y="216" width="140" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="714" y="241" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">claim-events</text>
  <text x="714" y="259" text-anchor="middle" fill="#6b7280" font-size="12">Kafka</text>
  <line x1="714" y1="272" x2="714" y2="318" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="644" y="320" width="140" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="714" y="345" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">Billing</text>
  <text x="714" y="363" text-anchor="middle" fill="#6b7280" font-size="12">records the payout</text>
  <rect x="466" y="300" width="140" height="76" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="1.5"/>
  <text x="536" y="324" text-anchor="middle" fill="#b45309" font-size="12.5" font-weight="600">Kafka down?</text>
  <text x="536" y="343" text-anchor="middle" fill="#b45309" font-size="12">The event waits in</text>
  <text x="536" y="359" text-anchor="middle" fill="#b45309" font-size="12">the outbox</text>
  <line x1="536" y1="272" x2="536" y2="298" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
