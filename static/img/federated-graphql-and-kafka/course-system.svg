<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="The course system. The Claims Desk app and the traffic script send every query to Hive Gateway, which asks the Policies, Claims, and Billing APIs for their parts. Your Claims API publishes claim events to Kafka, which Billing reads, and reads adjuster events that the Adjusting team's script sends." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="300" y="20" width="200" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="400" y="41" text-anchor="middle" font-weight="600" fill="#1f2937">Claims Desk</text>
  <text x="400" y="59" text-anchor="middle" fill="#6b7280" font-size="14">web app (app team)</text>

  <rect x="60" y="20" width="170" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="145" y="41" text-anchor="middle" font-weight="600" fill="#1f2937">npm run traffic</text>
  <text x="145" y="59" text-anchor="middle" fill="#6b7280" font-size="14">script</text>

  <!-- Clients to gateway -->
  <line x1="400" y1="70" x2="400" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="104" fill="#374151" font-size="14">queries + live updates</text>
  <line x1="145" y1="70" x2="235" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="108" fill="#374151" font-size="14">files claims</text>

  <!-- Gateway -->
  <rect x="150" y="130" width="500" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="400" y="151" text-anchor="middle" font-weight="600" fill="#1f2937">Hive Gateway</text>
  <text x="400" y="169" text-anchor="middle" fill="#6b7280" font-size="14">one endpoint for every app</text>

  <!-- Gateway to subgraphs -->
  <line x1="150" y1="180" x2="150" y2="238" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="180" x2="400" y2="238" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="650" y1="180" x2="650" y2="238" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="214" fill="#374151" font-size="14">asks each API for its part</text>

  <!-- Subgraphs -->
  <rect x="60" y="240" width="180" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="150" y="263" text-anchor="middle" font-weight="600" fill="#1f2937">Policies API</text>
  <text x="150" y="282" text-anchor="middle" fill="#6b7280" font-size="14">policyholders, policies</text>

  <rect x="310" y="240" width="180" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="400" y="263" text-anchor="middle" font-weight="600" fill="#0f766e">Claims API</text>
  <text x="400" y="282" text-anchor="middle" fill="#0f766e" font-size="14">claims (yours)</text>

  <rect x="560" y="240" width="180" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="650" y="263" text-anchor="middle" font-weight="600" fill="#1f2937">Billing API</text>
  <text x="650" y="282" text-anchor="middle" fill="#6b7280" font-size="14">premiums, payouts</text>

  <!-- Kafka -->
  <rect x="60" y="370" width="680" height="64" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <text x="80" y="407" font-weight="600" fill="#1f2937">Kafka</text>
  <rect x="200" y="384" width="170" height="36" rx="18" fill="#ffffff" stroke="#6b7280"/>
  <text x="285" y="407" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace" font-size="14">adjuster-events</text>
  <rect x="460" y="384" width="170" height="36" rx="18" fill="#ffffff" stroke="#6b7280"/>
  <text x="545" y="407" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace" font-size="14">claim-events</text>

  <!-- Event flows -->
  <line x1="450" y1="296" x2="510" y2="382" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="488" y="334" fill="#0f766e" font-size="14">publishes</text>
  <line x1="590" y1="382" x2="640" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="624" y="350" fill="#374151" font-size="14">reads, records payouts</text>
  <line x1="300" y1="382" x2="352" y2="298" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="318" y="344" text-anchor="end" fill="#0f766e" font-size="14">reads</text>

  <!-- Adjusting team -->
  <rect x="200" y="470" width="170" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="285" y="491" text-anchor="middle" font-weight="600" fill="#1f2937">Adjusting team</text>
  <text x="285" y="509" text-anchor="middle" fill="#6b7280" font-size="14">script</text>
  <line x1="285" y1="470" x2="285" y2="422" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="295" y="452" fill="#374151" font-size="14">sends AdjusterAssigned</text>

  <!-- Legend -->
  <rect x="470" y="470" width="16" height="16" rx="3" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="494" y="483" fill="#1f2937" font-size="14">You write this code</text>
  <rect x="470" y="496" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="494" y="509" fill="#1f2937" font-size="14">Other teams: already running</text>
  <rect x="660" y="470" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text x="684" y="483" fill="#1f2937" font-size="14">A script</text>
</svg>
