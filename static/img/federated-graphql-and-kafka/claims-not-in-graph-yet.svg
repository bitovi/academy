<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="After setup, the Claims Desk queries the gateway on port 4000, and the gateway asks the Policies and Billing APIs for their parts. The gateway has no connection to your Claims API yet, because it isn't in the gateway's configuration. You can still query your Claims API directly in Apollo Sandbox on port 4002, but apps going through the gateway can't reach it." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <rect x="150" y="20" width="180" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="240" y="42" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Claims Desk</text>
  <text x="240" y="60" text-anchor="middle" fill="#6b7280" font-size="12">port 3000</text>
  <rect x="530" y="20" width="200" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="630" y="42" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">You, in Apollo Sandbox</text>
  <text x="630" y="60" text-anchor="middle" fill="#6b7280" font-size="12">port 4002</text>
  <rect x="40" y="120" width="400" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="240" y="145" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="600">Gateway</text>
  <text x="240" y="163" text-anchor="middle" fill="#6b7280" font-size="12">port 4000, knows Policies and Billing</text>
  <line x1="240" y1="70" x2="240" y2="118" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="100" text-anchor="start" fill="#6b7280" font-size="12">queries</text>
  <rect x="40" y="250" width="180" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="130" y="275" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Policies API</text>
  <text x="130" y="293" text-anchor="middle" fill="#6b7280" font-size="12">policies</text>
  <rect x="260" y="250" width="180" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="350" y="275" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">Billing API</text>
  <text x="350" y="293" text-anchor="middle" fill="#6b7280" font-size="12">payouts</text>
  <rect x="540" y="250" width="180" height="56" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="630" y="275" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="600">Your Claims API</text>
  <text x="630" y="293" text-anchor="middle" fill="#0f766e" font-size="12">claims</text>
  <line x1="130" y1="176" x2="130" y2="248" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="176" x2="350" y2="248" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="160" x2="538" y2="262" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-warn)"/>
  <rect x="479.4" y="191" width="19.2" height="26" fill="#ffffff"/>
  <text x="489" y="211" text-anchor="middle" fill="#b45309" font-size="20" font-weight="700">✕</text>
  <text x="512" y="190" text-anchor="start" fill="#b45309" font-size="12">not in the gateway's</text>
  <text x="512" y="206" text-anchor="start" fill="#b45309" font-size="12">config yet</text>
  <line x1="630" y1="70" x2="630" y2="248" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="642" y="150" text-anchor="start" fill="#0f766e" font-size="12">direct, only</text>
  <text x="642" y="166" text-anchor="start" fill="#0f766e" font-size="12">for testing</text>
</svg>
