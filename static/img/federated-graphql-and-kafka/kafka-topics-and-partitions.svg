<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="The course's Kafka setup. One broker holds two topics, claim-events and adjuster-events, each split into three partitions. Each partition has one copy, because there's only one broker (replication factor 1). Events with the same key, like two events for claim c4, land in the same partition, in order. Your Claims API writes claim-events and the Billing consumer group reads all three of its partitions. The Adjusting team writes adjuster-events, and your Claims API will read it as its own consumer group." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
