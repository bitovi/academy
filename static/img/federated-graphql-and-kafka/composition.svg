<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Composition. The Policies subgraph defines Policy with id, policyNumber, and annualPremium, and the policies query. The Billing subgraph adds payouts and totalPaidOut to the same Policy type. Your Claims subgraph defines Claim and the claims query. Composing them produces one supergraph schema, where Policy has every field and each field is marked with the subgraph that resolves it. The gateway serves the supergraph." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <rect x="20" y="20" width="250" height="110" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="32" y="40" text-anchor="start" fill="#1f2937" font-size="13" font-weight="600">Policies subgraph</text>
  <text x="32" y="62" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Policy @key(fields: "id") {</text>
  <text x="46.6" y="78" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">id  policyNumber</text>
  <text x="46.6" y="94" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">annualPremium ...</text>
  <text x="32" y="110" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <rect x="20" y="150" width="250" height="110" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="32" y="170" text-anchor="start" fill="#1f2937" font-size="13" font-weight="600">Billing subgraph</text>
  <text x="32" y="192" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Policy @key(fields: "id") {</text>
  <text x="46.6" y="208" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">id  payouts</text>
  <text x="46.6" y="224" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">totalPaidOut</text>
  <text x="32" y="240" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <rect x="20" y="280" width="250" height="110" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="32" y="300" text-anchor="start" fill="#0f766e" font-size="13" font-weight="600">Your Claims subgraph</text>
  <text x="32" y="322" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Claim {</text>
  <text x="46.6" y="338" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">id  claimNumber</text>
  <text x="46.6" y="354" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">status  policyId ...</text>
  <text x="32" y="370" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <rect x="310" y="175" width="120" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="370" y="202" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="600">compose</text>
  <text x="370" y="220" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Menlo, Consolas, monospace">hive dev</text>
  <line x1="270" y1="75" x2="308" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="205" x2="308" y2="205" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="335" x2="308" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="205" x2="466" y2="205" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="468" y="40" width="200" height="330" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="480" y="62" text-anchor="start" fill="#1f2937" font-size="13" font-weight="600">Supergraph schema</text>
  <text x="480" y="86" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Policy {</text>
  <text x="494.6" y="106" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">policyNumber</text>
  <text x="656" y="106" text-anchor="end" fill="#6b7280" font-size="11">policies</text>
  <text x="494.6" y="126" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">annualPremium</text>
  <text x="656" y="126" text-anchor="end" fill="#6b7280" font-size="11">policies</text>
  <text x="494.6" y="146" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">payouts</text>
  <text x="656" y="146" text-anchor="end" fill="#6b7280" font-size="11">billing</text>
  <text x="494.6" y="166" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">totalPaidOut</text>
  <text x="656" y="166" text-anchor="end" fill="#6b7280" font-size="11">billing</text>
  <text x="480" y="186" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <text x="480" y="206" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Claim {</text>
  <text x="494.6" y="226" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">claimNumber</text>
  <text x="656" y="226" text-anchor="end" fill="#0f766e" font-size="11">claims</text>
  <text x="494.6" y="246" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">status</text>
  <text x="656" y="246" text-anchor="end" fill="#0f766e" font-size="11">claims</text>
  <text x="480" y="266" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <text x="480" y="286" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">type Query {</text>
  <text x="494.6" y="306" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">policies</text>
  <text x="656" y="306" text-anchor="end" fill="#6b7280" font-size="11">policies</text>
  <text x="494.6" y="326" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">claims</text>
  <text x="656" y="326" text-anchor="end" fill="#0f766e" font-size="11">claims</text>
  <text x="480" y="346" text-anchor="start" fill="#1f2937" font-size="12" font-family="Menlo, Consolas, monospace">}</text>
  <line x1="668" y1="205" x2="706" y2="205" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="708" y="170" width="80" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="748" y="202" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">Gateway</text>
  <text x="748" y="220" text-anchor="middle" fill="#6b7280" font-size="11">serves it</text>
  <text x="568" y="395" text-anchor="middle" fill="#6b7280" font-size="12">each field remembers its subgraph</text>
</svg>
